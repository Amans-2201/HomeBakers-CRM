services:
  - type: web
    name: home-bakers-orders-crm
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      - key: FIREBASE_PROJECT_ID
        value: butterbitebakers
      - key: FIREBASE_WEB_API_KEY
        sync: false
      - key: MAILERSEND_API_TOKEN
        sync: false
      - key: MAILERSEND_FROM_EMAIL
        value: orders@test-yxj6lj9mmoq4do2r.mlsender.net
